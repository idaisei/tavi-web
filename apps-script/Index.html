<!doctype html>
<html lang="ja">
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; }
    html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; background: #0b0c0e; }
    .loading { position: fixed; inset: 0; display: grid; place-items: center; color: #b8c2d4; font: 14px -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
</head>
<body>
  <div class="loading">読み込んでいます…</div>
  <iframe id="app" src="<?= appUrl ?>" title="<?= appName ?>" allow="geolocation; screen-wake-lock"></iframe>
  <script>
    const PUBLIC_ORIGIN = 'https://idaisei.github.io';
    window.addEventListener('message', (event) => {
      const request = event.data;
      if (event.origin !== PUBLIC_ORIGIN || request?.channel !== 'tavi-private' || !request.id) return;
      const source = event.source;
      google.script.run
        .withSuccessHandler((result) => source.postMessage({ channel: 'tavi-private', id: request.id, result }, event.origin))
        .withFailureHandler((error) => source.postMessage({ channel: 'tavi-private', id: request.id, error: error?.message || '同期できませんでした' }, event.origin))
        .apiRequest({ path: request.path, method: request.method, body: request.body });
    });
    document.getElementById('app').addEventListener('load', () => document.querySelector('.loading')?.remove());
  </script>
</body>
</html>
