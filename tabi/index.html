<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TAVI MAPS｜今どう動けばいいか</title>
<meta name="description" content="旅行中に「で、結局いつ出ればいいのか」だけを出す。1画面で終わらせるための旅のしおり。">
<meta name="theme-color" content="#131b2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="../assets/base.css">
<style>
  .deck { padding-block: 18px 40px; display: grid; gap: 14px; }

  /* 判断カード。旅行中に見るのはここだけで済むようにする。 */
  .verdict { border-left: 4px solid var(--gold); }
  .verdict.ok   { border-left-color: var(--good); }
  .verdict.soon { border-left-color: var(--warn); }
  .verdict.late { border-left-color: var(--bad); }
  .verdict h2 { font-size: clamp(22px, 6vw, 30px); margin-block: 4px 6px; }

  .stop {
    display: grid; grid-template-columns: 1fr auto; gap: 8px 12px;
    padding: 11px 0; border-bottom: 1px solid var(--edge);
  }
  .stop:last-child { border-bottom: 0; }
  .stop .nm { font-weight: 600; }
  .stop .meta { font-size: 12px; color: var(--slate-dim); }
  .stop .acts { display: flex; gap: 6px; align-items: center; }
  .stop button { min-height: 34px; padding: 5px 10px; font-size: 12px; }

  .daycard summary {
    cursor: pointer; font-weight: 700; padding: 6px 0;
    display: flex; justify-content: space-between; gap: 10px;
  }
  .daycard summary::-webkit-details-marker { display: none; }

  #map { height: 260px; border-radius: 10px; border: 1px solid var(--edge); }
  .leaflet-container { background: #0e1524; }

  .cand {
    width: 100%; text-align: left; display: block; margin-bottom: 6px;
    background: var(--inset); border: 1px solid var(--edge);
  }
  .cand small { display: block; color: var(--slate-dim); font-weight: 400; font-size: 11.5px;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  dialog {
    border: 1px solid var(--edge); border-radius: var(--radius);
    background: var(--raise); color: var(--cream);
    max-width: 480px; width: calc(100% - 28px); padding: 18px;
  }
  dialog::backdrop { background: rgba(6,9,18,.7); }

  .hourly { display: grid; grid-auto-flow: column; gap: 10px; overflow-x: auto;
            padding-bottom: 4px; text-align: center; font-size: 12px; }
  .hourly > div { min-width: 46px; }
  .quiet { font-size: 12.5px; color: var(--slate-dim); }
  .hidden { display: none !important; }
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a href="../">← ホーム</a>
    <strong style="margin-left:auto" id="tripTitle">TAVI MAPS</strong>
    <button class="ghost" id="tripsBtn" style="min-height:34px;padding:5px 10px;font-size:12px">旅行</button>
  </div>
</header>

<main class="wrap deck">

  <!-- 判断 -->
  <section class="card verdict" id="verdict">
    <p class="eyebrow" id="verdictLabel">次の締切</p>
    <h2 id="verdictHead">旅程がまだありません</h2>
    <p class="muted" id="verdictSub">「旅行」から作るか、サンプルを読み込んでください。</p>
    <div class="row" style="margin-top:10px">
      <button class="ghost" id="locBtn" style="min-height:36px;padding:6px 12px;font-size:12.5px">現在地から逆算する</button>
      <span class="quiet" id="locLine"></span>
    </div>
  </section>

  <!-- 天気 -->
  <section class="card hidden" id="weatherCard">
    <div class="spread">
      <p class="eyebrow">天気</p>
      <span class="quiet" id="weatherWhere"></span>
    </div>
    <p style="font-size:30px;font-weight:700;margin:6px 0 2px" id="weatherNow">—</p>
    <p class="quiet" id="weatherLine"></p>
    <div class="hourly" id="hourly" style="margin-top:10px"></div>
    <p class="quiet" style="margin-top:8px">
      出典：Open-Meteo。警報・注意報は含みません。<br>
      天気だけは外と通信します。渡すのは地点の数字だけで、旅程の中身は送りません。
    </p>
  </section>

  <!-- 旅程 -->
  <section id="days"></section>

  <div class="row wrap">
    <button id="autoPlacesBtn">場所をまとめて自動でつける</button>
    <button class="ghost" id="addDayStopBtn">立ち寄りを足す</button>
  </div>
  <p class="quiet" id="autoResult"></p>

  <p class="quiet" style="text-align:center;margin-top:20px">
    旅程はこのブラウザの中だけに保存されます。<br>
    場所と天気の取得以外、どこにも送っていません。
  </p>
</main>

<!-- 旅行の管理 -->
<dialog id="tripsDialog">
  <h2 style="font-size:17px">旅行</h2>
  <div class="grid" id="tripList" style="margin-block:10px"></div>
  <hr style="border:0;border-top:1px solid var(--edge);margin:14px 0">
  <form id="newTripForm" class="grid">
    <div><label for="ntTitle">新しい旅行の題名</label><input id="ntTitle" placeholder="城崎ひとり旅"></div>
    <div class="row">
      <div style="flex:1"><label for="ntStart">開始</label><input id="ntStart" type="date"></div>
      <div style="flex:1"><label for="ntEnd">終了</label><input id="ntEnd" type="date"></div>
    </div>
    <button type="submit" class="primary">この旅行を作る</button>
  </form>
  <button class="ghost" id="loadSample" style="margin-top:10px;width:100%">サンプルの旅程を読み込む</button>
  <button class="ghost" id="tripsClose" style="margin-top:10px;width:100%">閉じる</button>
</dialog>

<!-- 場所を決める -->
<dialog id="placeDialog">
  <h2 style="font-size:17px" id="placeTitle">場所を決める</h2>
  <p class="quiet" id="placeState"></p>
  <div class="row" style="margin-block:10px">
    <input id="placeQuery" placeholder="探す言葉">
    <button id="placeSearch" class="primary">探す</button>
  </div>
  <div id="placeCands" style="max-height:170px;overflow:auto"></div>
  <p class="quiet" id="placeError"></p>
  <div id="map" style="margin-top:8px"></div>
  <p class="quiet">候補に無い場所は、地図を動かして中心を合わせてください。</p>
  <div class="row" style="margin-top:10px">
    <button class="primary" id="placeConfirm" style="flex:1">この場所で確定する</button>
    <button class="ghost" id="placeClose">閉じる</button>
  </div>
  <button class="danger" id="placeClear" style="width:100%;margin-top:8px">確定を取り消す</button>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
